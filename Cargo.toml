[package]
name = "g502-rs"
version = "0.1.0"
edition = "2024"
default-run = "g502-rs"

[dependencies]
hidapi = "2.6.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
ab_glyph = "0.2"
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
tray-icon = "0.19"
winreg = "0.55"
